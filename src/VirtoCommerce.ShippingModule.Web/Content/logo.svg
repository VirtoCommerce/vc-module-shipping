<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Shipping">
  <title>Shipping</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#9D86F5"/>
      <stop offset="100%" stop-color="#6A45D9"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#2C1670" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <g transform="translate(62,62)" filter="url(#lift)">
    <!-- Motion lines -->
    <g stroke="#FFC24D" stroke-width="4.5" stroke-linecap="round">
      <line x1="-54" y1="-12" x2="-40" y2="-12"/>
      <line x1="-56" y1="-1" x2="-44" y2="-1"/>
      <line x1="-54" y1="10" x2="-42" y2="10"/>
    </g>

    <!-- Cargo box -->
    <rect x="-38" y="-24" width="52" height="38" rx="4" fill="#ffffff"/>
    <!-- Cab -->
    <path d="M14,-8 H30 L42,6 V14 H14 Z" fill="#5FC8F5"/>
    <rect x="18" y="-3" width="13" height="10" rx="2" fill="#D7EFFB"/>

    <!-- Wheels -->
    <circle cx="-18" cy="18" r="10" fill="#2C3A4E"/>
    <circle cx="-18" cy="18" r="4" fill="#ffffff"/>
    <circle cx="26" cy="18" r="10" fill="#2C3A4E"/>
    <circle cx="26" cy="18" r="4" fill="#ffffff"/>
  </g>
</svg>
